[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genshin-map-tracker"
version = "0.1.0"
description = "Rastreador de mapa para Genshin Impact baseado apenas em captura de tela."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",  # matchTemplate com máscara em TM_CCOEFF_NORMED
    "mss>=9.0",
    "psutil>=5.9",
    "dxcam>=0.0.5; sys_platform == 'win32'",
]

[project.optional-dependencies]
web = ["playwright>=1.45"]
ocr = ["rapidocr_onnxruntime>=1.2"]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
gmt = "gmt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
