# Copie para config.toml e ajuste. Tudo é opcional: o que faltar usa o padrão.

[capture]
fps = 5              # 1 a 30. 5 já basta para rastrear; mais FPS = mais CPU.
backend = "auto"     # "auto" (dxcam, cai para mss), "dxcam" ou "mss"
output_dir = "out"

[minimap]
# Círculo do minimapa na resolução de referência 1920x1080.
# Medido em prints reais 1920x1080 pela seta do jogador.
# Para conferir/ajustar: `gmt calibrate print1.png print2.png ...`
center_x = 169.0
center_y = 125.0
radius = 100.0
